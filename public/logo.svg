<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <clipPath id="circleView">
    <circle cx="50" cy="50" r="50"/>
  </clipPath>
  <g clip-path="url(#circleView)">
    <!-- Top Left: Red -->
    <rect x="0" y="0" width="50" height="50" fill="#FF3B30"/>
    <!-- Top Right: White with black J -->
    <rect x="50" y="0" width="50" height="50" fill="#FFFFFF"/>
    <text x="75" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="34" fill="#000000" text-anchor="middle" dominant-baseline="central">J</text>
    <!-- Bottom Left: White with black S -->
    <rect x="0" y="50" width="50" height="50" fill="#FFFFFF"/>
    <text x="25" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="34" fill="#000000" text-anchor="middle" dominant-baseline="central">S</text>
    <!-- Bottom Right: Red -->
    <rect x="50" y="50" width="50" height="50" fill="#FF3B30"/>
  </g>
</svg>
