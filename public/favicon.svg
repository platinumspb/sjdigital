<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 100 100" fill="none">
  <g clip-path="url(#favicon-clip)">
    <!-- Top-Left: Red -->
    <rect x="0" y="0" width="50" height="50" fill="#FF2B2B" />
    
    <!-- Top-Right: White with Black 'J' -->
    <rect x="50" y="0" width="50" height="50" fill="#FFFFFF" />
    <text
      x="75"
      y="25"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="600"
      font-size="36"
      fill="#000000"
      text-anchor="middle"
      dominant-baseline="central"
    >J</text>

    <!-- Bottom-Left: White with Black 'S' -->
    <rect x="0" y="50" width="50" height="50" fill="#FFFFFF" />
    <text
      x="25"
      y="75"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="600"
      font-size="36"
      fill="#000000"
      text-anchor="middle"
      dominant-baseline="central"
    >S</text>

    <!-- Bottom-Right: Red -->
    <rect x="50" y="50" width="50" height="50" fill="#FF2B2B" />
  </g>
  <defs>
    <clipPath id="favicon-clip">
      <circle cx="50" cy="50" r="50" />
    </clipPath>
  </defs>
</svg>